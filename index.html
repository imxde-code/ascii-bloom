<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Bloom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a terminal window on the left that plays the bloom, a narrow control rail on the right; stacks on phones. */
:root {
  --bg: #07080c;
  --panel: #0e1118;
  --line: #1c2230;
  --fg: #d9dde7;
  --muted: #7c859a;
  --accent: #ff6b95;
  --screen: #000000;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.wrap {
  display: grid; grid-template-columns: auto minmax(0, 330px); gap: 28px;
  justify-content: center; align-items: start; max-width: 1100px; margin: 0 auto;
}
.term { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--screen); box-shadow: 0 30px 80px -30px rgba(255,107,149,.18); }
.bar {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px;
  background: #151925; border-bottom: 1px solid var(--line);
  font: 500 12px/1 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden;
}
.dots { display: flex; gap: 6px; flex: none; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
.bar b { color: var(--fg); font-weight: 600; }
.screen { position: relative; aspect-ratio: 9 / 16; height: min(78vh, 820px); background: var(--screen); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.rail { display: flex; flex-direction: column; gap: 22px; min-width: 0; padding-top: 4px; }
h1 { font: 700 30px/1.05 var(--mono); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.lede { margin: 8px 0 0; color: var(--muted); line-height: 1.55; }
.group { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.label { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, .filebtn {
  font: 500 13px/1 var(--sans); color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; cursor: pointer;
}
button:hover, .filebtn:hover { border-color: #2f3850; }
button:focus-visible, .filebtn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #1a0710; border-color: var(--accent); font-weight: 600; min-width: 84px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 8px 11px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: #1b2131; color: var(--fg); }
.slider { display: grid; grid-template-columns: 88px 1fr 42px; align-items: center; gap: 10px; }
.slider span { color: var(--muted); }
.slider output { font: 500 12px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.timeline { display: flex; flex-direction: column; gap: 6px; }
.stage-name { display: flex; justify-content: space-between; font: 500 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-name b { color: var(--accent); font-weight: 600; }
.filebtn { display: inline-flex; align-items: center; gap: 8px; position: relative; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0; }
.stats { font: 500 12px/1.7 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 500; }
.ramp { font: 400 11px/1.5 var(--mono); color: #9aa3b8; word-break: break-all; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .screen { height: auto; width: 100%; }
  .term { max-width: 480px; width: 100%; margin: 0 auto; }
  .rail { max-width: 480px; width: 100%; margin: 0 auto; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="term">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span><b>ascii_bloom.py</b> — Renderer.convert() + draw()</span></div>
    <div class="screen" id="screen"><canvas id="out" aria-label="A bouquet of flowers growing from a vase, drawn in colored ASCII characters" role="img"></canvas></div>
  </div>

  <aside class="rail">
    <div>
      <h1>ASCII <span>Bloom</span></h1>
      <p class="lede">A bouquet grows out of a vase, redrawn every frame as colored text. Brightness picks the character, edges get slashes and bars.</p>
    </div>

    <div class="group">
      <div class="row">
        <button class="primary" id="play" type="button">Pause</button>
        <button id="restart" type="button">Replay</button>
        <div class="seg" role="group" aria-label="Playback speed">
          <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="2" aria-pressed="false">2×</button>
        </div>
      </div>
      <div class="timeline">
        <input type="range" id="scrub" min="0" max="19.5" step="0.01" value="0" aria-label="Timeline">
        <div class="stage-name"><b id="stage">vase</b><span id="clock">0.0s</span></div>
      </div>
    </div>

    <div class="group">
      <span class="label">Render</span>
      <div class="seg" role="group" aria-label="Render style">
        <button type="button" data-style="ramp" aria-pressed="false">Glyphs</button>
        <button type="button" data-style="edges" aria-pressed="true">Glyphs + edges</button>
        <button type="button" data-style="blocks" aria-pressed="false">Blocks</button>
      </div>
      <label class="slider"><span>Density</span><input type="range" id="cols" min="48" max="150" step="2" value="92"><output id="colsOut">92</output></label>
      <label class="slider"><span>Saturation</span><input type="range" id="sat" min="0" max="2" step="0.05" value="1.35"><output id="satOut">1.35</output></label>
      <label class="slider"><span>Edges</span><input type="range" id="edges" min="0" max="1" step="0.05" value="0.35"><output id="edgesOut">0.35</output></label>
    </div>

    <div class="group">
      <span class="label">Source</span>
      <div class="row">
        <label class="filebtn">Convert your own video<input type="file" id="file" accept="video/*"></label>
        <button type="button" id="back" hidden>Back to the bloom</button>
      </div>
      <p class="note">Your video is processed in this tab and never uploaded.</p>
    </div>

    <div class="group">
      <span class="label">Live</span>
      <div class="stats" id="stats">grid <b>–</b></div>
      <div class="ramp" id="ramp"></div>
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- config ----------
  const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
  const EDGE = ["-", "\\", "|", "/"];
  const W = 360, H = 640, T = 19.5;
  const FONT = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

  const state = {
    t: 0.8, playing: true, speed: 1, style: "edges",
    cols: 92, sat: 1.35, edges: 0.35, source: "bloom",
  };
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) { state.t = 13; state.playing = false; } } catch (e) {}

  // ---------- elements ----------
  const $ = (id) => document.getElementById(id);
  const out = $("out"), octx = out.getContext("2d");
  const scene = document.createElement("canvas"); scene.width = W; scene.height = H;
  const sctx = scene.getContext("2d");
  const small = document.createElement("canvas");
  const smctx = small.getContext("2d", { willReadFrequently: true });
  const video = document.createElement("video");
  video.muted = true; video.loop = true; video.playsInline = true;
  $("ramp").textContent = RAMP.trim();

  // ---------- helpers ----------
  const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
  const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const easeIO = (x) => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const hash = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };

  // ---------- the bouquet ----------
  const P = {
    red:     ["#7a0a22", "#c8143c", "#ff7088"],
    pink:    ["#8a1c52", "#e0478f", "#ffb8d6"],
    coral:   ["#8a2a14", "#ef5b3a", "#ffbe95"],
    violet:  ["#3b1f80", "#7b4fd6", "#cdb6ff"],
    blush:   ["#8c5a6e", "#e6aabe", "#fff1f5"],
    magenta: ["#6e1062", "#c21e9a", "#ff94e4"],
    wine:    ["#621034", "#9e1450", "#ff6fa6"],
  };
  const FLOWERS = [
    { x: 180, y: 200, R: 46, p: P.red, d: 1.2, rot: 0.2 },
    { x: 114, y: 248, R: 39, p: P.pink, d: 1.8, rot: 1.1 },
    { x: 250, y: 236, R: 41, p: P.coral, d: 2.3, rot: 2.0 },
    { x: 150, y: 312, R: 31, p: P.magenta, d: 2.7, rot: 0.7 },
    { x: 84,  y: 330, R: 33, p: P.violet, d: 3.0, rot: 1.6 },
    { x: 278, y: 322, R: 35, p: P.blush, d: 3.4, rot: 2.6 },
    { x: 214, y: 300, R: 31, p: P.wine, d: 3.8, rot: 0.4 },
  ];
  const FILLERS = [
    { x: 56, y: 262, r: 10, d: 5.0 }, { x: 304, y: 262, r: 11, d: 5.3 },
    { x: 136, y: 170, r: 9, d: 5.6 }, { x: 230, y: 168, r: 10, d: 5.9 },
    { x: 64, y: 390, r: 9, d: 6.1 }, { x: 300, y: 392, r: 9, d: 6.3 },
    { x: 184, y: 132, r: 8, d: 6.6 }, { x: 108, y: 210, r: 8, d: 6.8 }, { x: 262, y: 290, r: 8, d: 7.0 },
  ];
  const BASE_Y = 448;

  function stemCurve(f, i, time, g) {
    const bx = 180 + (f.x - 180) * 0.16, by = BASE_Y;
    const sway = Math.sin(time * 0.9 + i * 1.7) * 3.2 * g;
    const hx = f.x + sway, hy = f.y;
    const cx = bx + (hx - bx) * 0.15, cy = (by + hy) / 2 + 12;
    const pt = (u) => {
      const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
      return [a * bx + b * cx + c * hx, a * by + b * cy + c * hy];
    };
    const tan = (u) => [2 * (1 - u) * (cx - bx) + 2 * u * (hx - cx), 2 * (1 - u) * (cy - by) + 2 * u * (hy - cy)];
    return { pt, tan };
  }

  function drawStem(ctx, curve, g, width) {
    if (g <= 0) return;
    ctx.beginPath();
    const n = 26;
    for (let k = 0; k <= n; k++) {
      const [x, y] = curve.pt((k / n) * g);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = "#2f8a3e"; ctx.lineWidth = width; ctx.lineCap = "round"; ctx.stroke();
    ctx.strokeStyle = "rgba(150,230,140,.35)"; ctx.lineWidth = width * 0.35; ctx.stroke();
  }

  function drawLeaf(ctx, x, y, ang, len, w) {
    if (len < 1) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.45, -w, len, 0);
    ctx.quadraticCurveTo(len * 0.45, w, 0, 0);
    const gr = ctx.createLinearGradient(0, -w, 0, w);
    gr.addColorStop(0, "#5fd06e"); gr.addColorStop(0.5, "#2a8c3c"); gr.addColorStop(1, "#0e3e1a");
    ctx.fillStyle = gr; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.9, 0);
    ctx.strokeStyle = "#0b3315"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  function drawBloom(ctx, x, y, R, p, b, rot, scale, time) {
    if (scale <= 0.01) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale * 0.9);
    const breathe = 1 + Math.sin(time * 1.3 + rot * 3) * 0.015 * b;
    ctx.scale(breathe, breathe);
    // sepals
    const sep = 1 - ease((b - 0.3) / 0.5);
    if (sep > 0.02) {
      for (let s = 0; s < 5; s++) drawLeaf(ctx, 0, R * 0.12, Math.PI / 2 + (s - 2) * 0.55, R * 0.42 * sep, R * 0.1);
    }
    const layers = [7, 6, 5, 4];
    for (let k = 0; k < layers.length; k++) {
      const lo = ease((b - k * 0.09) / 0.72);
      const rk = R * (0.3 + 0.7 * lo) * (1 - k * 0.2);
      const n = layers[k];
      const gr = ctx.createRadialGradient(0, 0, rk * 0.05, 0, 0, rk * 1.05);
      gr.addColorStop(0, p[0]); gr.addColorStop(0.45, p[1]); gr.addColorStop(1, p[2]);
      for (let i = 0; i < n; i++) {
        const a = rot + k * 0.45 + (i / n) * Math.PI * 2;
        const d = rk * (0.28 + 0.16 * lo);
        ctx.save(); ctx.rotate(a); ctx.translate(d, 0);
        ctx.beginPath(); ctx.ellipse(0, 0, rk * (0.42 + 0.12 * lo), rk * (0.3 + 0.08 * lo), 0, 0, Math.PI * 2);
        ctx.restore();
        ctx.fillStyle = gr; ctx.fill();
        ctx.strokeStyle = p[0]; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.3; ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    // tight core
    ctx.beginPath(); ctx.arc(0, 0, R * (0.1 + 0.06 * b), 0, Math.PI * 2);
    ctx.fillStyle = p[0]; ctx.fill();
    ctx.beginPath(); ctx.arc(-R * 0.03, -R * 0.03, R * 0.05, 0, Math.PI * 1.4);
    ctx.strokeStyle = p[1]; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  function drawFiller(ctx, x, y, r, b) {
    if (b <= 0.01) return;
    const s = ease(b);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.3);
      gr.addColorStop(0, "#1b3a9a"); gr.addColorStop(0.6, "#3f7de8"); gr.addColorStop(1, "#b6d4ff");
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6, r * 0.62, r * 0.5, a, 0, Math.PI * 2);
      ctx.fillStyle = gr; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2); ctx.fillStyle = "#ffd447"; ctx.fill();
    ctx.restore();
  }

  function vasePath(ctx) {
    ctx.beginPath();
    ctx.moveTo(146, 440);
    ctx.bezierCurveTo(140, 470, 98, 488, 102, 530);
    ctx.bezierCurveTo(106, 572, 140, 586, 150, 600);
    ctx.lineTo(210, 600);
    ctx.bezierCurveTo(220, 586, 254, 572, 258, 530);
    ctx.bezierCurveTo(262, 488, 220, 470, 214, 440);
    ctx.closePath();
  }

  function drawVase(ctx, a) {
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 26);
    // floor shadow
    const sh = ctx.createRadialGradient(180, 612, 4, 180, 612, 100);
    sh.addColorStop(0, "rgba(140,150,190,.35)"); sh.addColorStop(1, "rgba(140,150,190,0)");
    ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(180, 612, 100, 12, 0, 0, Math.PI * 2); ctx.fill();
    // handles
    ctx.strokeStyle = "#d9a441"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(147, 458); ctx.bezierCurveTo(108, 448, 98, 486, 116, 500); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(213, 458); ctx.bezierCurveTo(252, 448, 262, 486, 244, 500); ctx.stroke();
    // body
    vasePath(ctx);
    const gr = ctx.createLinearGradient(100, 0, 260, 0);
    gr.addColorStop(0, "#0a0f30"); gr.addColorStop(0.3, "#2b3ea6"); gr.addColorStop(0.42, "#9cb4ff");
    gr.addColorStop(0.55, "#3a52c4"); gr.addColorStop(1, "#080c26");
    ctx.fillStyle = gr; ctx.fill();
    ctx.save(); vasePath(ctx); ctx.clip();
    for (let y = 452; y < 600; y += 13) {
      ctx.fillStyle = y % 2 ? "rgba(255,150,190,.32)" : "rgba(255,205,120,.28)";
      ctx.fillRect(90, y, 180, 4);
    }
    ctx.restore();
    // rim + foot
    ctx.beginPath(); ctx.ellipse(180, 440, 36, 7, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#05060f"; ctx.fill(); ctx.strokeStyle = "#e8b54e"; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = "#d9a441"; ctx.fillRect(148, 598, 64, 8);
    ctx.restore();
  }

  function drawScene(ctx, t, time) {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    // stems + leaves (back), then fillers, then blooms front to back by height
    FLOWERS.forEach((f, i) => {
      const g = ease((t - f.d) / 3.2);
      const c = stemCurve(f, i, time, g);
      drawStem(ctx, c, g, 4);
      [[0.32, -1], [0.58, 1], [0.78, -1]].forEach(([s, side], j) => {
        const lg = ease((g - s) / 0.25);
        if (lg <= 0) return;
        const [x, y] = c.pt(s); const [tx, ty] = c.tan(s);
        const ang = Math.atan2(ty, tx) + side * (1.05 + Math.sin(time + i + j) * 0.05);
        drawLeaf(ctx, x, y, ang, 30 * lg * (1 - j * 0.15), 9 * lg);
      });
    });
    FILLERS.forEach((f, i) => {
      const g = ease((t - f.d) / 2);
      const c = stemCurve(f, i + 7, time, g);
      drawStem(ctx, c, g, 2);
      const [x, y] = c.pt(g);
      drawFiller(ctx, x, y, f.r * 1.3, (t - f.d - 1.5) / 2);
    });
    FLOWERS.map((f, i) => [f, i]).sort((a, b) => a[0].y - b[0].y).forEach(([f, i]) => {
      const g = ease((t - f.d) / 3.2);
      const c = stemCurve(f, i, time, g);
      const [x, y] = c.pt(g);
      const bud = ease((g - 0.7) / 0.3);
      const b = easeIO((t - f.d - 2.6) / 5);
      drawBloom(ctx, x, y, f.R * 1.3, f.p, b, f.rot, bud, time);
    });
    drawVase(ctx, ease(t / 1.2));
  }

  function stageName(t) {
    if (t < 1.2) return "vase";
    if (t < 4) return "stems";
    if (t < 6.2) return "buds";
    if (t < 11.6) return "blooming";
    if (t < 16) return "full bloom";
    if (t < 18.5) return "dissolve";
    return "rest";
  }

  // ---------- ASCII conversion ----------
  let charRatio = 0.6, dpr = 1, geom = null;

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = out.getBoundingClientRect();
    out.width = Math.max(1, Math.round(r.width * dpr));
    out.height = Math.max(1, Math.round(r.height * dpr));
    const cellW = out.width / state.cols;
    const fontPx = cellW / charRatio;
    const cellH = fontPx * 1.08;
    const rows = Math.max(8, Math.floor(out.height / cellH));
    geom = { cellW, cellH: out.height / rows, fontPx, rows };
  }

  function convert(dissolve) {
    const { cellW, cellH, fontPx, rows } = geom;
    const cols = state.cols, blocks = state.style === "blocks";
    const sh = blocks ? rows * 2 : rows;
    if (small.width !== cols || small.height !== sh) { small.width = cols; small.height = sh; }
    smctx.imageSmoothingEnabled = true; smctx.imageSmoothingQuality = "high";
    smctx.drawImage(scene, 0, 0, cols, sh);
    const d = smctx.getImageData(0, 0, cols, sh).data;
    const n = cols * sh, sat = state.sat;
    const R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n), L = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      let r = d[j], g = d[j + 1], b = d[j + 2];
      const y = 0.299 * r + 0.587 * g + 0.114 * b;
      r = y + (r - y) * sat; g = y + (g - y) * sat; b = y + (b - y) * sat;
      R[i] = r < 0 ? 0 : r > 255 ? 255 : r; G[i] = g < 0 ? 0 : g > 255 ? 255 : g; B[i] = b < 0 ? 0 : b > 255 ? 255 : b;
      L[i] = (0.299 * R[i] + 0.587 * G[i] + 0.114 * B[i]) / 255;
    }
    octx.fillStyle = "#000"; octx.fillRect(0, 0, out.width, out.height);
    let drawn = 0;

    if (blocks) {
      const hh = cellH / 2;
      for (let y = 0; y < sh; y++) for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (L[i] < 0.04) continue;
        if (dissolve > 0 && hash(x, y >> 1) < dissolve) continue;
        octx.fillStyle = `rgb(${R[i] | 0},${G[i] | 0},${B[i] | 0})`;
        octx.fillRect(Math.floor(x * cellW), Math.floor(y * hh), Math.ceil(cellW), Math.ceil(hh));
        drawn++;
      }
      return drawn;
    }

    const useEdges = state.style === "edges" && state.edges > 0;
    const thresh = 0.8 - 0.6 * state.edges;
    const nr = RAMP.length;
    octx.font = `600 ${fontPx}px ${FONT}`;
    octx.textBaseline = "top";
    const L_ = (x, y) => L[(y < 0 ? 0 : y >= rows ? rows - 1 : y) * cols + (x < 0 ? 0 : x >= cols ? cols - 1 : x)];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y * cols + x, lum = L[i];
      if (lum < 0.045) continue;
      if (dissolve > 0 && hash(x, y) < dissolve) continue;
      let ch = RAMP[Math.min(nr - 1, Math.max(0, Math.floor(Math.pow(lum, 0.62) * (nr - 1) + 0.5)))];
      if (useEdges && lum > 0.12) {
        const gx = -L_(x - 1, y - 1) - 2 * L_(x - 1, y) - L_(x - 1, y + 1) + L_(x + 1, y - 1) + 2 * L_(x + 1, y) + L_(x + 1, y + 1);
        const gy = -L_(x - 1, y - 1) - 2 * L_(x, y - 1) - L_(x + 1, y - 1) + L_(x - 1, y + 1) + 2 * L_(x, y + 1) + L_(x + 1, y + 1);
        const mag = Math.hypot(gx, gy) / 4;
        if (mag > thresh) {
          const ang = ((Math.atan2(gy, gx) * 180 / Math.PI) + 90 + 360) % 180;
          ch = EDGE[Math.floor(((ang + 22.5) % 180) / 45)];
        }
      }
      if (ch === " ") continue;
      // keep dim colors readable: blend toward the same hue at full brightness
      const v = Math.max(R[i], G[i], B[i], 1), k = 0.6 * 255 / v;
      const r = Math.min(255, R[i] * (0.4 + k)), g = Math.min(255, G[i] * (0.4 + k)), b = Math.min(255, B[i] * (0.4 + k));
      octx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
      octx.fillText(ch, x * cellW, y * cellH);
      drawn++;
    }
    return drawn;
  }

  // ---------- video source ----------
  function drawVideo() {
    sctx.fillStyle = "#000"; sctx.fillRect(0, 0, W, H);
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const s = Math.max(W / vw, H / vh);
    const dw = vw * s, dh = vh * s;
    sctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }

  // ---------- UI ----------
  const playBtn = $("play"), scrub = $("scrub"), stageEl = $("stage"), clockEl = $("clock"), statsEl = $("stats");

  function syncPlay() { playBtn.textContent = state.playing ? "Pause" : "Play"; }
  function togglePlay() {
    state.playing = !state.playing;
    if (state.source === "video") state.playing ? video.play().catch(() => {}) : video.pause();
    syncPlay();
  }
  playBtn.addEventListener("click", togglePlay);
  $("restart").addEventListener("click", () => {
    if (state.source === "video") video.currentTime = 0; else state.t = 0;
    if (!state.playing) togglePlay();
  });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !/INPUT|BUTTON|SELECT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); togglePlay(); }
  });
  scrub.addEventListener("input", () => {
    const v = parseFloat(scrub.value);
    if (state.source === "video") video.currentTime = v; else state.t = v;
  });
  document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => {
    state.speed = parseFloat(b.dataset.speed); video.playbackRate = state.speed;
    document.querySelectorAll("[data-speed]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  }));
  document.querySelectorAll("[data-style]").forEach((b) => b.addEventListener("click", () => {
    state.style = b.dataset.style;
    document.querySelectorAll("[data-style]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  }));
  const bindSlider = (id, key, fmt) => {
    const el = $(id), o = $(id + "Out");
    el.addEventListener("input", () => { state[key] = parseFloat(el.value); o.textContent = fmt(state[key]); if (key === "cols") layout(); });
  };
  bindSlider("cols", "cols", (v) => String(v));
  bindSlider("sat", "sat", (v) => v.toFixed(2));
  bindSlider("edges", "edges", (v) => v.toFixed(2));

  let videoURL = null;
  $("file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(f);
    video.src = videoURL; video.playbackRate = state.speed;
    video.onloadedmetadata = () => { scrub.max = String(video.duration || 1); };
    video.play().catch(() => {});
    state.source = "video"; state.playing = true; syncPlay();
    $("back").hidden = false;
  });
  $("back").addEventListener("click", () => {
    video.pause(); state.source = "bloom"; state.t = 0; scrub.max = String(T);
    $("back").hidden = true; $("file").value = ""; state.playing = true; syncPlay();
  });

  // ---------- loop ----------
  let last = performance.now(), lastDraw = 0, fps = 30, fpsAcc = 0, fpsN = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (state.playing && state.source === "bloom") { state.t += dt * state.speed; if (state.t >= T) state.t -= T; }
    if (now - lastDraw >= 1000 / 30 - 1) {
      const fdt = now - lastDraw; lastDraw = now;
      fpsAcc += fdt; fpsN++;
      if (fpsAcc > 500) { fps = Math.round(1000 / (fpsAcc / fpsN)); fpsAcc = 0; fpsN = 0; }
      let dissolve = 0, label, clock;
      if (state.source === "bloom") {
        drawScene(sctx, state.t, now / 1000);
        dissolve = state.t > 16 ? clamp01((state.t - 16) / 2.5) : 0;
        label = stageName(state.t); clock = state.t;
      } else {
        drawVideo(); label = "your video"; clock = video.currentTime || 0;
      }
      if (document.activeElement !== scrub) scrub.value = String(clock);
      stageEl.textContent = label; clockEl.textContent = clock.toFixed(1) + "s";
      const drawn = convert(dissolve);
      statsEl.innerHTML = `grid <b>${state.cols}×${geom.rows}</b> · <b>${fps}</b> fps · <b>${drawn.toLocaleString()}</b> ${state.style === "blocks" ? "blocks" : "glyphs"}`;
    }
    requestAnimationFrame(frame);
  }

  function start() {
    try {
      octx.font = `600 100px ${FONT}`;
      const w = octx.measureText("M").width / 100;
      if (w > 0.3 && w < 1) charRatio = w;
    } catch (e) {}
    layout();
    syncPlay();
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => layout()).observe($("screen"));
  const fontReady = document.fonts && document.fonts.load ? document.fonts.load(`600 16px "JetBrains Mono"`) : Promise.resolve();
  Promise.race([fontReady, new Promise((r) => setTimeout(r, 1200))]).catch(() => {}).then(start);
})();
</script>
</body>
</html>
